# Transfer Desk HQ on Render — background worker
# Runs `npm run watch` continuously in the cloud so posting no longer
# depends on your computer being on. Disk persists seen.json / drafts /
# downloaded media across restarts and deploys.

services:
  - type: worker
    name: transfer-desk-hq
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run watch
    disk:
      name: transfer-desk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TRANSFER_DESK_STORAGE
        value: /var/data
      - key: POST_MODE
        value: post
      - key: POSTS_PER_SOURCE
        value: "5"
      - key: MAX_POSTS_PER_CYCLE
        value: "3"
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_SECRET
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
